  const t0 = Date.parse(d[0].date), t1 = Date.parse(d[d.length - 1].date);
  const x = (r) => d.length > 1 ? px + (Date.parse(r.date) - t0) / (t1 - t0) * (w - 2 * px) : w / 2;
  const y = (r) => py + (1 - (r.low - (mid - span / 2)) / span) * (h - 2 * py);
  const svg = sv('svg', { viewBox: `0 0 ${w} ${h}`, height: h, role: 'img', 'aria-label': '每日最低價走勢' });
  const gid = 'g' + ORDER.indexOf(it.item);
  const grad = sv('linearGradient', { id: gid, x1: 0, x2: 0, y1: 0, y2: 1 });
  [[0, .26], [.25, .16], [.5, .08], [.75, .03], [1, 0]].forEach(([o, op]) => grad.append(sv('stop', { offset: o, style: `stop-color:var(--accent);stop-opacity:${op}` })));
  const defs = sv('defs'); defs.append(grad); svg.append(defs);
  const pts = d.map((r) => `${x(r)},${y(r)}`);
  if (d.length > 1) svg.append(sv('path', { d: `M${pts.join('L')}L${x(d[d.length - 1])},${h - 2}L${x(d[0])},${h - 2}Z`, fill: `url(#${gid})` }));
  svg.append(sv('path', { d: 'M' + pts.join('L'), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  box.append(svg);
  const tip = el('div', { class: 'tip' }); tip.hidden = true; box.append(tip);
  d.forEach((r, i) => {
    const last = i === d.length - 1;
    const c = sv('circle', { cx: x(r), cy: y(r), r: last ? 4 : 3, fill: last ? 'var(--accent)' : 'var(--panel)', stroke: 'var(--accent)', 'stroke-width': 1.5 });
    c.addEventListener('mouseenter', () => tipAt(box, tip, x(r) / w, -30, [document.createTextNode(r.date + '　'), el('b', {}, '最低 ' + money(r.low))]));
    c.addEventListener('mouseleave', () => { tip.hidden = true; });
    svg.append(c);
  });
}

function render() {
  const items = model();
  const below = items.filter((i) => i.vsBase < 0);
  const best = [...items].sort((a, b) => a.vsBase - b.vsBase)[0];
  const date = items.map((i) => i.date).sort().pop();

  const take = document.getElementById('take');
  if (below.length) take.append('今天有 ', el('b', {}, below.length), ' 款低於基準價。最划算的是', el('b', {}, best.item), '，在', el('b', {}, best.low.store), '買比基準價低 ', el('b', { class: 'hl' }, money(-best.vsBase)), '。');
  else if (best) take.append('今天還沒有任何一款低於基準價，最接近的是', el('b', {}, best.item), '，還差 ', el('b', {}, money(best.vsBase)), '。');
  const kb = document.getElementById('k-below');
  kb.append(String(below.length), el('small', {}, `／ ${items.length} 款`));
  document.getElementById('k-total').textContent = money(below.reduce((s, i) => s - i.vsBase, 0));
  document.getElementById('k-date').textContent = date;
  document.getElementById('base-date').textContent = BASE[0] ? BASE[0].set_on : '';
  document.getElementById('built').textContent = BUILT;

  const root = document.getElementById('items');
  for (const it of items) {
    const card = el('article', { class: 'card', id: 'item-' + ORDER.indexOf(it.item) });
    const head = el('div', { class: 'head' });
    const icon = el('div', { class: 'icon', 'aria-hidden': 'true' }); icon.innerHTML = ICONS[it.item] || '';
    const title = el('div', { class: 'title' });
    title.append(el('h2', {}, it.item), el('div', { class: 'sub num' }, `${it.brand}・${it.model}`));
    const st = it.vsBase < 0 ? ['below', '低於基準價'] : it.vsBase > 0 ? ['above', '高於基準價'] : ['', '與基準價持平'];
    head.append(icon, title, el('span', { class: 'status ' + st[0] }, st[1]));

    const hero = el('div', { class: 'hero' });
    const left = el('div');
    left.append(el('div', { class: 'label' }, '今日全網最低'), el('div', { class: 'low num' }, money(it.low.price)), el('div', { class: 'store' }, it.low.store));
    const buy = el('a', { class: 'buy', href: it.low.url, target: '_blank', rel: 'noopener' }, '前往購買 ↗');
    hero.append(left, buy);

    const g = el('div', { class: 'gauge' });
    const facts = el('div', { class: 'facts' });
    const fact = (label, text, cls) => { const f = el('div', { class: 'fact' }); f.append(el('span', { class: 'label' }, label), el('span', { class: 'v num ' + cls }, text)); facts.append(f); };
    fact('比基準價', it.vsBase == null ? '—' : signed(it.vsBase, '低 ', '高 '), tone(it.vsBase));
    fact('最低價較上次', it.lowChange == null ? '首次紀錄' : signed(it.lowChange, '↓ ', '↑ '), tone(it.lowChange));

    const trend = el('div');
    const sp = el('div', { class: 'spark' });
    trend.append(el('div', { class: 'label' }, '每日最低價走勢'), sp);

    const tb = el('div');
    tb.append(el('div', { class: 'label' }, `各通路價格（${it.today.length} 家）`));
    const wrap = el('div', { class: 'tablewrap' });
    const table = el('table');
    const thead = el('tr');
    thead.append(el('th', {}, '通路'), el('th', { class: 'r' }, '價格'), el('th', { class: 'r' }, '比基準價'), el('th', { class: 'col-note' }, '備註'));
    table.append(el('thead')); table.firstChild.append(thead);
    const body = el('tbody');
    it.today.forEach((t, i) => {
      const tr = el('tr', { class: t.price === it.low.price ? 'best' : null });
      const a = el('a', { href: t.url, target: '_blank', rel: 'noopener' });
      a.append(el('span', { class: 'rank num' }, i + 1), el('span', { class: 'nm' }, t.store), el('span', { class: 'muted', 'aria-hidden': 'true' }, '↗'));
      const c1 = el('td'); c1.append(a);
      const d = it.basePrice == null ? null : t.price - it.basePrice;
      tr.append(c1, el('td', { class: 'r num price' }, money(t.price)),
        el('td', { class: 'r num ' + tone(d) }, d == null ? '—' : d === 0 ? '持平' : (d < 0 ? '−' : '+') + money(Math.abs(d))),
        el('td', { class: 'note col-note' }, t.note || ''));
      body.append(tr);
    });
    table.append(body); wrap.append(table); tb.append(wrap);

    card.append(head, hero, g, facts, trend, tb);
    root.append(card);
    gauge(g, it);
    spark(sp, it);
  }
}
render();
</script>
</body>
</html>
